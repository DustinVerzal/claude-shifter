<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704.8 292" width="704.8" height="292" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15.5" role="img" aria-labelledby="t d"><title id="t">The shift pattern</title><desc id="d">A gear gate cut into a plate, five columns by four rows. The columns are gears one to five: low, medium, high, xhigh and max. The rows are the models: fable, opus, sonnet and haiku. A knob starts at opus high. Shift plus right takes it up to xhigh and then max. Control plus one sends it straight to low. Shift plus down twice moves it to haiku. Control plus three sends it to high, and shift plus up twice brings it home to opus.</desc><style>.lit{opacity:0}.home{opacity:1}#knob{transform:translate(384px,138px)}@media (prefers-reduced-motion:no-preference){.lit,.home{animation:9.80s step-end infinite both}#knob{animation:gate 9.80s infinite both}@keyframes gate{0%,18.367%{transform:translate(384px,138px);animation-timing-function:cubic-bezier(.3,1.5,.5,1)}20.408%,28.571%{transform:translate(506px,138px);animation-timing-function:cubic-bezier(.3,1.5,.5,1)}30.612%,38.776%{transform:translate(628px,138px);animation-timing-function:cubic-bezier(.3,1.5,.5,1)}40.816%,48.980%{transform:translate(140px,138px);animation-timing-function:cubic-bezier(.3,1.5,.5,1)}51.020%,59.184%{transform:translate(140px,176px);animation-timing-function:cubic-bezier(.3,1.5,.5,1)}61.224%,69.388%{transform:translate(140px,214px);animation-timing-function:cubic-bezier(.3,1.5,.5,1)}71.429%,79.592%{transform:translate(384px,214px);animation-timing-function:cubic-bezier(.3,1.5,.5,1)}81.633%,89.796%{transform:translate(384px,176px);animation-timing-function:cubic-bezier(.3,1.5,.5,1)}91.837%,100.000%{transform:translate(384px,138px)}}@keyframes g0{0.000%{opacity:0}38.776%{opacity:1}48.980%{opacity:1}59.184%{opacity:1}69.388%{opacity:0}100.000%{opacity:0}}#g0{animation-name:g0}@keyframes g1{0.000%{opacity:0}100.000%{opacit