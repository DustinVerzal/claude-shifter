<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704.8 328" width="704.8" height="328" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15.5" role="img" aria-labelledby="t d"><title id="t">The dialog before a model switch</title><desc id="d">Claude Code question dialog headed Model. It reads: Switch to sonnet? Prompt caches are per model, so the next request re-reads the whole conversation and costs more. The options are Switch to sonnet, and Keep haiku.</desc><rect x=".5" y=".5" width="703.8" height="327" rx="12" fill="#fbfbfa" stroke="#dfdfdb"/><g transform="translate(26 22)"><rect x="0.0" y="1" width="86.4" height="22" rx="2" fill="#5769f7"/><text x="9.6" y="17.2" fill="#ffffff" textLength="9.6" lengthAdjust="spacing">☐</text><text x="28.8" y="17.2" fill="#ffffff" textLength="48.0" lengthAdjust="spacing">Model</text></g><g transform="translate(26 46)"></g><g transform="translate(26 70)"><text x="0.0" y="17.2" fill="#666666" textLength="9.6" lengthAdjust="spacing">│</text><text x="19.2" y="17.2" fill="#000000" font-weight="700" textLength="57.6" lengthAdjust="spacing">Switch</text><text x="86.4" y="17.2" fill="#000000" font-weight="700" textLength="19.2" lengthAdjust="spacing">to</text><text x="115.2" y="17.2" fill="#000000" font-weight="700" textLength="67.2" lengthAdjust="spacing">sonnet?</text><text x="192.0" y="17.2" fill="#000000" font-weight="700" textLength="57.6" lengthAdjust="spacing">Prompt</text><text x="259.2" y="17.2" fill="#000000" font-weight="700" textLength="57.6" lengthAdjust="spacing">caches</text><text x="326.4" y="17.2" fill="#000000" font-weight="700" textLength="28.8" lengthAdjust="spacing">are</text><text x="364.8" y="17.2" fill="#000000" font-weight="700" textLength="28.8" lengthAdjust="spacing">per</text><text x="403.2" y="17.2" fill="#000000" font-weight="700" textLength="57.6" lengthAdjust="spacing">model,</text><text x="470.4" y="17.2" fill="#000000" font-weight="700" textLength="19.2" lengthAdjust="spacing">so</text><text x="499.2" y="17.2" fill="#000000" font-weight="700" textLength="28.8" lengthAdjust="spacing">the</text><text x="537.6" y="17.2" fill="#000000" font-weight="700" textLength="38.4" lengthAdjust="spacing">next</text><text x="585.6" y="17.2" fill="#000000" font-weight="700" textLength="67.2" lengthAdjust="spacing">request</text></g><g transform="translate(26 94)"><text x="0.0" y="17.2" fill="#666666" textLength="9.6" lengthAdjust="spacing">│</text><text x="19.2" y="17.2" fill="#000000" font-weight="700" textLength="76.8" lengthAdjust="spacing">re-reads</text><text x="105.6" y="17.2" fill="#000000" font-weight="700" textLength="28.8" lengthAdjust="spacing">the</text><text x="144.0" y="17.2" fill="#000000" font-weight="700" textLength="48.0" lengthAdjust="spacing">whole</text><text x="201.6" y="17.2" fill="#000000" font-weight="700" textLength="115.2" lengthAdjust="spacing">conversation</text><text x="326.4" y="17.2" fill="#000000" font-weight="700" textLength="28.8" lengthAdjust="spacing">and</text><text x="364.8" y="17.2" fill="#000000" font-weight="700" textLength="48.0" lengthAdjust="spacing">costs</text><text x="422.4" y="17.2" fill="#000000" font-weight="700" textLength="48.0" lengthAdjust="spacing">more.</text></g><g transform="translate(26 118)"></g><g transform="translate(26 142)"><path d="M1.6 6.6l5.6 5.4-5.6 5.4" fill="none" stroke="#5769f7" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><text x="19.2" y="17.2" fill="#666666" textLength="19.2" lengthAdjust="spacing">1.</text><text x="48.0" y="17.2" fill="#5769f7" textLength="57.6" lengthAdjust="spacing">Switch</text><text x="115.2" y="17.2" fill="#5769f7" textLength="19.2" lengthAdjust="spacing">to</text><text x="144.0" y="17.2" fill="#5769f7" textLength="57.6" lengthAdjust="spacing">sonnet</text></g><g transform="translate(26 166)"><text x="19.2" y="17.2" fill="#666666" textLength="19.2" lengthAdjust="spacing">2.</text><text x="48.0" y="17.2" fill="#1a1a18" textLength="38.4" lengthAdjust="spacing">Keep</text><text x="96.0" y="17.2" fill="#1a1a18" textLength="48.0" lengthAdjust="spacing">haiku</text></g><g transform="translate(26 190)"><text x="19.2" y="17.2" fill="#666666" textLength="19.2" lengthAdjust="spacing">3.</text><text x="48.0" y="17.2" fill="#666666" textLength="38.4" lengthAdjust="spacing">Type</text><text x="96.0" y="17.2" fill="#666666" textLength="96.0" lengthAdjust="spacing">something.</text></g><g transform="translate(26 214)"><rect x="0.0" y="11.5" width="652.8" height="1" fill="#666666"/></g><g transform="translate(26 238)"><text x="19.2" y="17.2" fill="#1a1a18" textLength="19.2" lengthAdjust="spacing">4.</text><text x="48.0" y="17.2" fill="#1a1a18" textLength="38.4" lengthAdjust="spacing">Chat</text><text x="96.0" y="17.2" fill="#1a1a18" textLength="48.0" lengthAdjust="spacing">about</text><text x="153.6" y="17.2" fill="#1a1a18" textLength="38.4" lengthAdjust="spacing">this</text></g><g transform="translate(26 262)"></g><g transform="translate(26 286)"><text x="0.0" y="17.2" fill="#666666" textLength="48.0" lengthAdjust="spacing">Enter</text><text x="57.6" y="17.2" fill="#666666" textLength="19.2" lengthAdjust="spacing">to</text><text x="86.4" y="17.2" fill="#666666" textLength="57.6" lengthAdjust="spacing">select</text><circle cx="158.4" cy="12" r="1.7" fill="#666666"/><text x="172.8" y="17.2" fill="#666666" textLength="28.8" lengthAdjust="spacing">↑/↓</text><text x="211.2" y="17.2" fill="#666666" textLength="19.2" lengthAdjust="spacing">to</text><text x="240.0" y="17.2" fill="#666666" textLength="76.8" lengthAdjust="spacing">navigate</text><circle cx="331.2" cy="12" r="1.7" fill="#666666"/><text x="345.6" y="17.2" fill="#666666" textLength="28.8" lengthAdjust="spacing">Esc</text><text x="384.0" y="17.2" fill="#666666" textLength="19.2" lengthAdjust="spacing">to</text><text x="412.8" y="17.2" fill="#666666" textLength="57.6" lengthAdjust="spacing">cancel</text></g></svg>
